name: Build icon compiler APK

on:
  push:
    branches:
      - 'chatgpt/vaguer-cam-icon-0.1.7'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PAPP_VERSION_CODE=17 -PAPP_VERSION_NAME=0.1.7-test

      - name: Collect Android signing tools
        run: |
          APKSIGNER_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          TOOL_DIR="$(dirname "$APKSIGNER_PATH")"
          cp "$TOOL_DIR/lib/apksigner.jar" apksigner.jar
          cp "$TOOL_DIR/zipalign" zipalign
          chmod +x zipalign

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VAGUER-Cam-icon-compiler
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: |
            apksigner.jar
            zipalign
          if-no-files-found: error
