name: Build icon compiler APK

on:
  push:
    branches:
      - 'chatgpt/vaguer-cam-icon-0.1.7'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PAPP_VERSION_CODE=17 -PAPP_VERSION_NAME=0.1.7-test

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VAGUER-Cam-icon-compiler
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
