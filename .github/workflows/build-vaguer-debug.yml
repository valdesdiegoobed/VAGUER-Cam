name: VAGUER Cam 0.1.9 Layout Monitor Test APK

on:
  push:
    branches:
      - vaguer-0.1.9-layout-monitor-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build and test installable debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug -PAPP_VERSION_CODE=10 -PAPP_VERSION_NAME=0.1.9-monitor-test
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/VAGUER-Cam-0.1.9-monitor-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VAGUER-Cam-0.1.9-monitor-test
          path: app/build/outputs/apk/debug/VAGUER-Cam-0.1.9-monitor-test.apk
          if-no-files-found: error
